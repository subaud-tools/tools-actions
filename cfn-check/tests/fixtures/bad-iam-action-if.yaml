# rule: no_wildcard_iam
# MUST FAIL: an Action built by !If on Resource "*": it is not a literal, so it cannot be judged.
AWSTemplateFormatVersion: "2010-09-09"
Description: cfn-check fixture.
Parameters:
  Extra:
    Type: String
    Default: "no"
    AllowedValues: ["yes", "no"]
Conditions:
  WantExtra: !Equals [!Ref Extra, "yes"]
Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: fixture
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: !If [WantExtra, "ec2:TerminateInstances", "ec2:StopInstances"]
                Resource: "*"
