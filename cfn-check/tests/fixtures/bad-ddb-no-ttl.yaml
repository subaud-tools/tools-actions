# rule: dynamodb_ttl_and_pitr
# MUST FAIL: a table with expiry and point-in-time recovery off (hail's fixture).
AWSTemplateFormatVersion: "2010-09-09"
Description: cfn-guard negative fixture - DynamoDB table without TTL/PITR.
Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: false
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
