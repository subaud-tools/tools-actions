# rule: no_wildcard_iam
# MUST PASS: only read actions (Describe, List, Get, and a trailing-wildcard read) on Resource "*", scalar and list forms.
AWSTemplateFormatVersion: "2010-09-09"
Description: cfn-check fixture.
Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: fixture
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:Describe*
                  - cloudfront:ListDistributions
                  - ssm:GetCommandInvocation
                Resource: "*"
              - Effect: Allow
                Action: autoscaling:DescribeAutoScalingGroups
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:DescribeTags
                Resource:
                  - "*"
              - Effect: Allow
                Action: ec2:DescribeVolumes
                Resource:
                  - "*"
