# rule: no_wildcard_iam
# MUST FAIL: a Statement written as one map, not a list, with a write action on Resource "*".
AWSTemplateFormatVersion: "2010-09-09"
Description: cfn-check fixture.
Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: fixture
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              Effect: Allow
              Action: ec2:TerminateInstances
              Resource: "*"
