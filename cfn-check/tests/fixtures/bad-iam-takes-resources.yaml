# rule: no_wildcard_iam
# MUST FAIL: ec2:CreateTags takes resources, so it is not on the list of actions allowed on "*".
AWSTemplateFormatVersion: "2010-09-09"
Description: cfn-check fixture.
Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: fixture
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:CreateTags
                Resource: "*"
