# rule: no_wildcard_iam
# MUST FAIL: a write action on Resource "*" beside a role whose policy has Statement: [] (the rule must not skip).
AWSTemplateFormatVersion: "2010-09-09"
Description: cfn-check fixture.
Resources:
  OtherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: empty
          PolicyDocument:
            Version: "2012-10-17"
            Statement: []
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: fixture
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: "*"
